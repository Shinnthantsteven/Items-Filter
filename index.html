<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1200, initial-scale=0.1">
    <title>Chef2Chef | Master Code</title>
    
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --brand: #10b981;
            --bg-color: #020617;
            --text: #f1f5f9;
            --header-bg: #010409;
            --glass-edge: rgba(255, 255, 255, 0.1);
            --danger: #ef4444;
            --portal-bg: rgba(15, 23, 42, 0.95);
            --input-bg: rgba(0,0,0,0.5);
            --hl: #fbbf24; /* Yellow Highlight Color */
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --text: #0f172a;
            --header-bg: #ffffff;
            --glass-edge: rgba(0, 0, 0, 0.1);
            --portal-bg: rgba(255, 255, 255, 0.95);
            --input-bg: rgba(255,255,255,0.8);
        }

        body, html { margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-color); color: var(--text); height: 100vh; overflow: hidden; transition: background 0.3s; }

        /* HIGHLIGHT STYLE */
        mark { 
            background: linear-gradient(120deg, #fbbf24, #fcd34d);
            color: #000; 
            border-radius: 3px; 
            padding: 0 4px; 
            box-shadow: 0 0 6px rgba(251,191,36,0.5); 
            transition: 0.3s;
        }
        mark:hover {
            background: linear-gradient(120deg, #fcd34d, #fbbf24);
            box-shadow: 0 0 12px rgba(251,191,36,0.7);
        }

        .theme-btn { background: none; border: none; cursor: pointer; font-size: 28px; padding: 10px; border-radius: 50%; }

        /* --- LOGIN SCREEN --- */
        #loginScreen {
            position: fixed; inset: 0; background: var(--bg-color); z-index: 2000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .knife-box { font-size: 80px; margin-bottom: 20px; filter: drop-shadow(0 0 20px var(--brand)); transition: 0.5s; }
        .knife-slice { transform: scale(15) translateX(100px); opacity: 0; }

        /* --- LIQUID GLASS LOGIN CARD --- */
        .login-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(20px) saturate(180%);
            padding: 50px;
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.2);
            text-align: center;
            width: 440px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15), inset 0 0 30px rgba(255,255,255,0.1);
            transition: all 0.3s ease;
        }
        .login-card h1 { margin: 0; font-weight: 800; font-size: 28px; }

        /* --- LIQUID INPUT --- */
        .login-card input {
            width: 100%; 
            padding: 20px; 
            border-radius: 25px; 
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.12);
            color: var(--text); 
            font-weight: 700; 
            font-size: 20px; 
            outline: none; 
            text-align: center; 
            margin-top: 20px;
            backdrop-filter: blur(12px);
            box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
            transition: all 0.4s ease;
        }
        .login-card input::placeholder {
            color: rgba(255,255,255,0.5);
        }
        .login-card input:focus {
            background: rgba(255,255,255,0.2);
            box-shadow: inset 0 0 14px rgba(255,255,255,0.3), 0 6px 24px rgba(0,0,0,0.2);
            transform: translateY(-1px);
        }

        /* --- LIQUID BUTTON --- */
        .unlock-btn {
            width: 100%; 
            padding: 20px; 
            border-radius: 50px; 
            border: none; 
            background: linear-gradient(145deg, rgba(16,185,129,0.5), rgba(59,130,246,0.5));
            color: white; 
            font-weight: 800; 
            cursor: pointer; 
            margin-top: 20px;
            backdrop-filter: blur(12px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2), inset 0 0 8px rgba(255,255,255,0.2);
            transition: all 0.35s ease;
        }
        .unlock-btn:hover {
            background: linear-gradient(145deg, rgba(16,185,129,0.7), rgba(59,130,246,0.7));
            transform: scale(1.05);
            box-shadow: 0 8px 28px rgba(0,0,0,0.25), inset 0 0 12px rgba(255,255,255,0.3);
        }

        /* --- NAVIGATION & CONTENT --- */
        .top-nav { padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; background: var(--header-bg); border-bottom: 1px solid var(--glass-edge); }
        .logo-container { display: flex; align-items: center; gap: 15px; text-decoration: none; color: inherit; }
        .logo-img { height: 45px; width: 45px; object-fit: contain; }
        .logo-text { font-weight: 800; font-size: 26px; }

        .content-container { flex: 1; overflow-y: auto; padding: 0 40px 180px 40px; height: calc(100vh - 80px); }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        
        th { position: sticky; top: 0; background: var(--bg-color); padding: 25px 15px; text-align: left; font-size: 11px; color: #94a3b8; text-transform: uppercase; z-index: 50; border-bottom: 2px solid var(--brand); }

        /* COLUMN WIDTHS */
        th:nth-child(1) { width: 90px; }
        th:nth-child(2) { width: 48%; }
        th:nth-child(3) { width: 75px; }
        th:nth-child(4) { width: 75px; }
        th:nth-child(5) { width: 110px; }
        th:nth-child(6) { width: 160px; }
        th:nth-child(7) { width: 180px; }
        th:nth-child(8) { width: 80px; }

        td { padding: 22px 15px; border-bottom: 1px solid var(--glass-edge); font-size: 14px; cursor: pointer; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .desc-cell { font-weight: 800; line-height: 1.6; color: var(--text); white-space: normal; }
        
        .brand-pill { background: rgba(59, 130, 246, 0.1); color: #3b82f6; padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12px; display: inline-block; }
        .origin-pill { background: rgba(16, 185, 129, 0.1); color: var(--brand); padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 12px; margin-left: 5px; display: inline-block; }
        
        /* --- PORTAL BAR WITH LIQUID GLASS --- */
        .portal-bar {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 1100px; padding: 15px 40px; border-radius: 100px;
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(25px) saturate(180%);
            border: 1.5px solid rgba(255,255,255,0.2); 
            display: flex; align-items: center; gap: 20px; z-index: 1000;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        #searchIn {
            background: rgba(255,255,255,0.12);
            border-radius: 50px;
            padding: 16px 24px;
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            outline: none;
            flex: 1;
            backdrop-filter: blur(12px);
            box-shadow: inset 0 0 10px rgba(255,255,255,0.2);
            transition: all 0.4s ease;
        }
        #searchIn::placeholder { color: rgba(255,255,255,0.5); }
        #searchIn:focus { 
            background: rgba(255,255,255,0.2);
            box-shadow: inset 0 0 14px rgba(255,255,255,0.3), 0 6px 24px rgba(0,0,0,0.2);
        }

        .portal-bar button {
            background: linear-gradient(145deg, rgba(16,185,129,0.5), rgba(59,130,246,0.5));
            border-radius: 50px;
            padding: 12px 30px;
            font-weight: 800;
            cursor: pointer;
            color: white;
            border: none;
            backdrop-filter: blur(12px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.2), inset 0 0 8px rgba(255,255,255,0.2);
            transition: all 0.35s ease;
        }
        .portal-bar button:hover {
            background: linear-gradient(145deg, rgba(16,185,129,0.7), rgba(59,130,246,0.7));
            transform: scale(1.05);
            box-shadow: 0 8px 28px rgba(0,0,0,0.25), inset 0 0 12px rgba(255,255,255,0.3);
        }

        #toast { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); background: var(--brand); color: white; padding: 10px 30px; border-radius: 50px; font-weight: 800; display: none; z-index: 9999; }
    </style>
</head>
<body onload="document.getElementById('passIn').focus()">

<div id="loginScreen">
    <div id="knife" class="knife-box">🔪</div>
    <div class="login-card">
        <h1>CHEF2CHEF ITEM CODE</h1>
        <input type="password" id="passIn" placeholder="••••••••">
        <button class="unlock-btn" onclick="checkAuth()">UNLOCK</button>
        <p id="err" style="color:var(--danger); font-size:11px; margin-top:15px; font-weight:700;"></p>
    </div>
</div>

<div id="toast">COPIED</div>

<nav class="top-nav">
    <a href="https://chef2chef.ae" target="_blank" class="logo-container">
        <img src="https://raw.githubusercontent.com/Shinnthantsteven/Chef2Chef-Master-Code/main/logo.png" class="logo-img">
        <div class="logo-text">CHEF2CHEF <span style="color:var(--brand)">MASTER</span></div>
    </a>
    <div style="display:flex; align-items:center; gap:20px;">
        <button class="theme-btn" onclick="toggleTheme()" id="navToggle">🌙</button>
        <div style="color: #94a3b8; font-size: 11px; font-weight: 800; border-left: 1px solid var(--glass-edge); padding-left: 20px;">ROOT: STEVE</div>
    </div>
</nav>

<div class="content-container">
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Description</th>
                <th>Cost</th>
                <th>U/M</th>
                <th>Packing</th>
                <th>Supplier</th>
                <th>Brand/Origin</th>
                <th>Part No.</th>
            </tr>
        </thead>
        <tbody id="list" onclick="handleQuickCopy(event)"></tbody>
    </table>
</div>

<div class="portal-bar">
    <input type="file" id="fileIn" style="display:none" onchange="manualUpload(event)">
    <button onclick="document.getElementById('fileIn').click()">📁</button>
    <input type="text" id="searchIn" placeholder="Search across all fields...">
    <button onclick="location.reload()">EXIT</button>
</div>

<script>
let db = [];
let currentSearch = "";

function toggleTheme() {
    const doc = document.documentElement;
    const next = doc.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    doc.setAttribute('data-theme', next);
    document.getElementById('navToggle').innerText = next === 'light' ? '☀️' : '🌙';
}

function checkAuth() {
    if(document.getElementById('passIn').value === '***REMOVED-PASSWORD***') {
        document.getElementById('knife').classList.add('knife-slice');
        setTimeout(() => {
            document.getElementById('loginScreen').style.display = 'none';
            autoLoad();
        }, 400);
    } else {
        document.getElementById('err').innerText = "DENIED";
    }
}

async function autoLoad() {
    try {
        const res = await fetch('data.csv?v=' + Date.now());
        const text = await res.text();
        processData(text);
    } catch(e) {}
}

function manualUpload(e) {
    const reader = new FileReader();
    reader.onload = (event) => processData(event.target.result);
    reader.readAsText(e.target.files[0]);
}

function processData(csv) {
    const wb = XLSX.read(csv, { type: 'string' });
    const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
    db = raw.map(r => ({
        id: String(r['Item'] || r['Item ID'] || "").trim(),
        desc: String(r['Description'] || "").trim(),
        cost: String(r['Cost'] || r['Price'] || "0").toLowerCase().replace('aed', '').trim(),
        um: String(r['U/M'] || "").trim(),
        pack: String(r['Case Packing'] || r['Case Pack'] || r['Packing'] || "").trim(),
        sup: String(r['Preferred Supplier'] || "").trim(),
        brand: String(r['Brand'] || "").trim(),
        origin: String(r['Origin'] || "UAE").trim(),
        part: String(r['Manu. Part No.'] || r['Part No.'] || "").trim()
    }));
    render(db);
}

function highlight(text) {
    if (!currentSearch) return text;
    const words = currentSearch.split(/\s+/).filter(w => w.length > 0);
    let highlighted = text;
    words.forEach(word => {
        const reg = new RegExp(`(${word})`, 'gi');
        highlighted = highlighted.replace(reg, '<mark>$1</mark>');
    });
    return highlighted;
}

document.getElementById('searchIn').addEventListener('input', (e) => {
    currentSearch = e.target.value.toLowerCase().trim();
    const terms = currentSearch.split(/\s+/);
    const filtered = db.filter(r => {
        const rowText = `${r.id} ${r.desc} ${r.pack} ${r.um} ${r.sup} ${r.brand} ${r.origin} ${r.part}`.toLowerCase();
        return terms.every(term => rowText.includes(term));
    });
    render(filtered);
});

function render(data) {
    const list = document.getElementById('list');
    list.innerHTML = data.slice(0, 150).map(r => `
        <tr>
            <td style="color:#64748b; font-size:12px;">${highlight(r.id)}</td>
            <
