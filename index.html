<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chef2Chef | Master Code Engine</title>
<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<style>
:root{--bg:#020617;--card:#0f172a;--text:#f1f5f9;--muted:#94a3b8;--brand:#10b981;--line:#1e293b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{padding:22px 32px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(2,6,23,.94);backdrop-filter:blur(12px)}h1{font-size:20px;margin:0}.tag{color:var(--brand);font-size:12px;font-weight:700}.wrap{max-width:1400px;margin:auto;padding:28px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:20px}.controls{display:flex;gap:12px;flex-wrap:wrap}input,button{font:inherit;border-radius:10px;padding:12px 14px}input{background:#020617;border:1px solid var(--line);color:var(--text);flex:1;min-width:220px}button{background:var(--brand);border:0;color:white;font-weight:700;cursor:pointer}button.secondary{background:#1e293b}.status{color:var(--muted);font-size:13px;margin-top:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:11px;text-transform:uppercase}tbody tr:hover{background:rgba(255,255,255,.03)}.table-wrap{overflow:auto;max-height:70vh}.empty{text-align:center;color:var(--muted);padding:50px}
</style>
</head>
<body>
<header><h1>Chef2Chef Master Code</h1><span class="tag">LOCAL-FIRST • NO API KEYS</span></header>
<main class="wrap">
<section class="card">
<h2>Inventory Viewer</h2>
<p>Load an inventory CSV or Excel file locally. The file stays in your browser and is never uploaded by this page.</p>
<div class="controls"><input id="file" type="file" accept=".csv,.xlsx,.xls"><input id="search" placeholder="Search loaded inventory…"><button class="secondary" id="clear">Clear</button></div>
<div id="status" class="status">No file loaded.</div>
</section>
<section class="card"><div class="table-wrap"><table><thead id="head"></thead><tbody id="body"></tbody></table></div><div id="empty" class="empty">Upload an inventory file to begin.</div></section>
</main>
<script>
let rows=[];
const file=document.getElementById('file'),search=document.getElementById('search'),head=document.getElementById('head'),body=document.getElementById('body'),empty=document.getElementById('empty'),status=document.getElementById('status');
file.addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;try{const data=await f.arrayBuffer();const wb=XLSX.read(data,{type:'array'});const sheet=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(sheet,{defval:''});status.textContent=`Loaded ${rows.length.toLocaleString()} rows from ${f.name}.`;render()}catch(err){rows=[];status.textContent='Could not read this file.';render()}});
search.addEventListener('input',render);document.getElementById('clear').addEventListener('click',()=>{rows=[];file.value='';search.value='';status.textContent='No file loaded.';render()});
function render(){const q=search.value.trim().toLowerCase();const filtered=q?rows.filter(r=>Object.values(r).some(v=>String(v).toLowerCase().includes(q))):rows;head.innerHTML='';body.innerHTML='';if(!rows.length){empty.style.display='block';return}empty.style.display='none';const keys=[...new Set(rows.flatMap(r=>Object.keys(r)))];head.innerHTML='<tr>'+keys.map(k=>`<th>${esc(k)}</th>`).join('')+'</tr>';body.innerHTML=filtered.slice(0,2000).map(r=>'<tr>'+keys.map(k=>`<td>${esc(r[k])}</td>`).join('')+'</tr>').join('');if(filtered.length>2000)status.textContent+=` Showing first 2,000 of ${filtered.length.toLocaleString()} matches.`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}render();
</script>
</body></html>
