<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chef2Chef | Master Code Engine</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/Shinnthantsteven/Chef2Chef-Master-Code/main/logo.png">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/Shinnthantsteven/Chef2Chef-Master-Code/main/logo.png">

    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand: #10b981;
            --brand-deep: #059669;
            --bg-color: #020617;
            --card-bg: #0f172a;
            --text: #f1f5f9;
            --header-bg: #010409;
            --glass-edge: rgba(255, 255, 255, 0.15);
            --danger: #ef4444;
            --hl: #fbbf24;
            --input-bg: rgba(0,0,0,0.3);
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --header-bg: #ffffff;
            --glass-edge: rgba(0, 0, 0, 0.15);
            --input-bg: rgba(255,255,255,0.4);
        }

        body, html { 
            margin: 0; padding: 0; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-color); color: var(--text); 
            height: 100vh; overflow: hidden; 
            transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo-wrap {
            width: 42px; height: 42px;
            background: #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden; border: 2px solid var(--brand);
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.4);
            flex-shrink: 0; clip-path: circle(50% at 50% 50%);
        }

        .header-logo { 
            width: 100%; height: 100%;
            object-fit: cover;
            image-rendering: -webkit-optimize-contrast;
            transform: translateZ(0);
        }

        mark { background: var(--hl); color: #000; border-radius: 4px; padding: 2px 4px; font-weight: 800; box-shadow: 0 0 12px rgba(251, 191, 36, 0.6); }

        #sideMenu {
            position: fixed; left: -280px; top: 0; width: 280px; height: 100%;
            background: var(--card-bg); z-index: 3000; transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            border-right: 1px solid var(--glass-edge); padding: 40px 20px; box-sizing: border-box;
            box-shadow: 20px 0 50px rgba(0,0,0,0.5);
        }
        #sideMenu.active { left: 0; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; z-index: 2500; backdrop-filter: blur(8px); }
        
        .menu-item { padding: 15px; margin-bottom: 10px; border-radius: 12px; background: rgba(255,255,255,0.05); font-weight: 700; cursor: pointer; border: 1px solid transparent; transition: 0.2s; }
        .menu-item:hover { background: rgba(255,255,255,0.08); border-color: var(--brand); }
        .menu-label { font-size: 11px; color: #94a3b8; text-transform: uppercase; margin: 20px 0 10px 15px; font-weight: 800; }

        .top-nav { 
            padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; 
            background: var(--header-bg); border-bottom: 1px solid var(--glass-edge);
            position: sticky; top: 0; z-index: 2000; backdrop-filter: blur(12px);
        }
        .menu-btn { font-size: 26px; cursor: pointer; color: var(--brand); }
        .logo-text { font-weight: 800; font-size: 20px; display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; letter-spacing: -0.5px; }

        #loginScreen { position: fixed; inset: 0; background: var(--bg-color); z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .knife-box { font-size: 80px; margin-bottom: 20px; filter: drop-shadow(0 0 25px var(--brand)); transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .knife-slice { transform: scale(15) translateX(100px) rotate(45deg); opacity: 0; }

        .login-card { 
            background: rgba(128,128,128,0.05); padding: 50px; border-radius: 40px; 
            border: 1px solid var(--glass-edge); text-align: center; width: 440px; 
            backdrop-filter: blur(20px); display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .login-card h1 { font-size: 24px; margin-bottom: 8px; font-weight: 800; }
        .login-card input { 
            width: 100%; box-sizing: border-box; padding: 20px; border-radius: 20px; 
            border: 1px solid var(--glass-edge); background: var(--input-bg); 
            color: var(--text); font-weight: 600; font-size: 20px; outline: none; 
            text-align: center; margin-top: 20px; transition: 0.3s;
        }
        .login-card input:focus { border-color: var(--brand); box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
        .unlock-btn { width: 100%; padding: 20px; border-radius: 20px; border: none; background: var(--brand); color: white; font-weight: 800; cursor: pointer; margin-top: 20px; transition: 0.3s; }
        .unlock-btn:hover { background: var(--brand-deep); transform: translateY(-1px); }

        .content-container { flex: 1; overflow-y: auto; padding: 0 40px 180px 40px; height: calc(100vh - 80px); }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { 
            position: sticky; top: 0; background: var(--bg-color); padding: 25px 15px; 
            text-align: left; font-size: 11px; color: #94a3b8; text-transform: uppercase; 
            z-index: 50; border-bottom: 2px solid var(--brand); letter-spacing: 1px;
        }

        /* Adjusted Spacing: More for Supplier, Less for MPN */
        th:nth-child(1) { width: 90px; }
        th:nth-child(2) { width: 38%; }
        th:nth-child(3) { width: 85px; }
        th:nth-child(4) { width: 75px; }
        th:nth-child(5) { width: 110px; }
        th:nth-child(6) { width: 190px; } /* Increased Supplier */
        th:nth-child(7) { width: 180px; }
        th:nth-child(8) { width: 70px; }  /* Decreased MPN */

        td { padding: 18px 15px; border-bottom: 1px solid var(--glass-edge); font-size: 13px; cursor: pointer; vertical-align: middle; transition: background 0.2s; overflow: hidden; text-overflow: ellipsis; }
        tr:hover td { background: rgba(255,255,255,0.02); }
        
        .desc-cell { font-weight: 700; line-height: 1.4; color: var(--text); white-space: normal; }
        .brand-pill { background: rgba(59,130,246,0.1); color: #60a5fa; padding: 4px 10px; border-radius: 6px; font-weight: 700; font-size: 10px; display: inline-block; border: 1px solid rgba(59,130,246,0.2); }
        .origin-pill { background: rgba(16,185,129,0.1); color: var(--brand); padding: 4px 10px; border-radius: 6px; font-weight: 700; font-size: 10px; margin-left: 4px; display: inline-block; border: 1px solid rgba(16,185,129,0.2); }
        .cat-pill { background: rgba(251,191,36,0.1); color: #fbbf24; padding: 4px 10px; border-radius: 6px; font-weight: 700; font-size: 10px; margin-left: 4px; display: inline-block; border: 1px solid rgba(251,191,36,0.2); }
        .state-pill { background: rgba(167,139,250,0.1); color: #a78bfa; padding: 4px 10px; border-radius: 6px; font-weight: 700; font-size: 10px; margin-left: 4px; display: inline-block; border: 1px solid rgba(167,139,250,0.2); }

        /* Bubble Tube Search Bar */
        .portal-bar {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 85%; max-width: 1100px; padding: 12px 35px; border-radius: 100px;
            background: transparent; border: 1.5px solid var(--glass-edge);
            display: flex; align-items: center; gap: 20px; z-index: 1000;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
        }
        #searchIn { background: transparent; border: none; color: var(--text); font-size: 16px; font-weight: 700; outline: none; flex: 1; }
        #searchIn::placeholder { color: var(--text); opacity: 0.5; }

        #toast { position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%); background: var(--brand); color: white; padding: 10px 30px; border-radius: 50px; font-weight: 800; display: none; z-index: 9999; box-shadow: 0 10px 20px rgba(0,0,0,0.3); }
    </style>
</head>
<body onload="document.getElementById('passIn').focus()">

<div id="sideMenu">
    <h2 style="margin-left:15px; font-size:18px; letter-spacing:-0.5px;">SYSTEM MENU</h2>
    <div class="menu-label">Preferences</div>
    <div class="menu-item" onclick="toggleTheme(); toggleMenu();">🌓 Toggle Visual Theme</div>
    <div class="menu-item" onclick="location.reload()">🔄 Refresh Engine Data</div>
    <button onclick="toggleMenu()" style="width:100%; padding:15px; margin-top:30px; border-radius:12px; border:none; background:var(--danger); color:white; font-weight:800; cursor:pointer;">CLOSE MENU</button>
</div>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>

<div id="loginScreen">
    <div id="knife" class="knife-box">🔪</div>
    <div class="login-card">
        <h1>MASTER CODE ENGINE</h1>
        <p style="font-size: 11px; opacity: 0.5; font-weight: 700;">CHEF2CHEF SECURE ACCESS</p>
        <input type="password" id="passIn" placeholder="••••••••" onkeydown="if(event.key === 'Enter') checkAuth()">
        <button class="unlock-btn" onclick="checkAuth()">INITIALIZE SYSTEM</button>
        <p id="err" style="color:var(--danger); font-size:11px; margin-top:15px; font-weight:700;"></p>
    </div>
</div>

<div id="toast">DATA COPIED</div>

<nav class="top-nav">
    <div style="display:flex; align-items:center; gap:20px;">
        <div class="menu-btn" onclick="toggleMenu()">☰</div>
        <a href="https://chef2chef.ae" target="_blank" class="logo-text">
            <div class="logo-wrap">
                <img src="https://raw.githubusercontent.com/Shinnthantsteven/Chef2Chef-Master-Code/main/logo.png" class="header-logo" alt="Logo">
            </div>
            <span>CHEF2CHEF <span style="color:var(--brand)">MASTER</span></span>
        </a>
    </div>
    <div style="display:flex; align-items:center; gap:20px;">
        <div style="color: #64748b; font-size: 10px; font-weight: 800; border-right: 1px solid var(--glass-edge); padding-right: 20px;">SYS_ROOT: STEVE</div>
        <button class="theme-btn" onclick="toggleTheme()" id="navToggle" style="background:none; border:none; cursor:pointer; font-size:22px;">🌙</button>
    </div>
</nav>

<div class="content-container">
    <table>
        <thead>
            <tr>
                <th>UID</th>
                <th>Item Description / Class</th>
                <th>Cost</th>
                <th>U/M</th>
                <th>Case Pack</th>
                <th>Supplier</th>
                <th>Brand/Origin/Cat</th>
                <th>MPN</th>
            </tr>
        </thead>
        <tbody id="list" onclick="handleQuickCopy(event)"></tbody>
    </table>
</div>

<div class="portal-bar">
    <input type="file" id="fileIn" style="display:none" onchange="manualUpload(event)">
    <button onclick="document.getElementById('fileIn').click()" style="background:none; border:none; cursor:pointer; font-size:24px; opacity:0.6;">📁</button>
    <input type="text" id="searchIn" placeholder="Filter through master records...">
    <button onclick="location.reload()" style="background:var(--danger); border:none; color:white; padding:12px 30px; border-radius:50px; font-weight:800; cursor:pointer;">EXIT</button>
</div>

<script>
let db = [];
let currentSearch = "";

function toggleMenu() {
    document.getElementById('sideMenu').classList.toggle('active');
    const overlay = document.getElementById('overlay');
    overlay.style.display = overlay.style.display === 'block' ? 'none' : 'block';
}

function toggleTheme() {
    const doc = document.documentElement;
    const next = doc.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    doc.setAttribute('data-theme', next);
    document.getElementById('navToggle').innerText = next === 'light' ? '☀️' : '🌙';
}

function checkAuth() {
    if(document.getElementById('passIn').value === '***REMOVED-PASSWORD***') {
        document.getElementById('knife').classList.add('knife-slice');
        setTimeout(() => {
            document.getElementById('loginScreen').style.display = 'none';
            autoLoad();
        }, 400);
    } else {
        document.getElementById('err').innerText = "ACCESS DENIED: INCORRECT CODE";
    }
}

async function autoLoad() {
    try {
        const res = await fetch('data.csv?v=' + Date.now());
        const text = await res.text();
        processData(text);
    } catch(e) { console.log("Auto-load failed. Manual upload required."); }
}

function manualUpload(e) {
    const reader = new FileReader();
    reader.onload = (event) => processData(event.target.result);
    reader.readAsText(e.target.files[0]);
}

function cleanString(str) {
    return String(str || "").replace(/[^\x20-\x7E]/g, '').trim();
}

function processData(csv) {
    try {
        const wb = XLSX.read(csv, { type: 'string' });
        const raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
        db = raw.map(r => ({
            id: cleanString(r['Item']),
            desc: cleanString(r['Description']),
            cost: cleanString(r['Cost']).toLowerCase().replace(/aed/g, '').trim(),
            um: cleanString(r['Base U/M']).split(' (')[0],
            pack: cleanString(r['Case Packing'] || r['Case Pack']),
            cat: cleanString(r['Cat 2']),
            state: cleanString(r['State']),
            sup: cleanString(r['Preferred Supplier']),
            brand: cleanString(r['Brand']),
            origin: cleanString(r['Origin'] || "UAE"),
            manu: cleanString(r['Manu. Part No.'] || r['Manu. Par'])
        }));
        render(db);
    } catch(e) { console.log("Data processing error."); }
}

function highlight(text) {
    if (!currentSearch || !text) return text;
    const terms = currentSearch.split(/\s+/).filter(w => w.length > 0);
    let highlighted = text;
    terms.forEach(word => {
        const reg = new RegExp(`(${word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        highlighted = highlighted.replace(reg, '<mark>$1</mark>');
    });
    return highlighted;
}

document.getElementById('searchIn').addEventListener('input', (e) => {
    currentSearch = e.target.value.toLowerCase().trim();
    const terms = currentSearch.split(/\s+/);
    const filtered = db.filter(r => {
        const rowText = `${r.id} ${r.desc} ${r.pack} ${r.cat} ${r.sup} ${r.brand} ${r.manu}`.toLowerCase();
        return terms.every(term => rowText.includes(term));
    });
    render(filtered);
});

function render(data) {
    const list = document.getElementById('list');
    list.innerHTML = data.slice(0, 100).map(r => `
        <tr>
            <td style="color:#64748b; font-family:monospace; font-weight:700;">${highlight(r.id)}</td>
            <td>
                <div class="desc-cell">${highlight(r.desc)}</div>
            </td>
            <td style="color:var(--brand); font-weight:800; font-size:16px;">${r.cost}</td>
            <td style="font-weight:700;">${highlight(r.um)}</td>
            <td>
                <div style="color:#818cf8; font-weight:700;">${highlight(r.pack)}</div>
            </td>
            <td style="color:#a78bfa; font-size:12px; font-weight:700;">${highlight(r.sup)}</td>
            <td>
                <span class="brand-pill">${highlight(r.brand)}</span>
                <span class="origin-pill">${highlight(r.origin)}</span>
                <span class="cat-pill">${highlight(r.cat)}</span>
                <span class="state-pill">${highlight(r.state)}</span>
            </td>
            <td style="color:#64748b; font-size:11px; font-family: monospace;">${highlight(r.manu)}</td>
        </tr>
    `).join('');
}

function handleQuickCopy(e) {
    const cell = e.target.closest('td');
    if (!cell) return;
    navigator.clipboard.writeText(cell.innerText).then(() => {
        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        if (window.navigator.vibrate) window.navigator.vibrate(50);
        setTimeout(() => { toast.style.display = 'none'; }, 600);
    });
}
</script>
</body>
</html>
